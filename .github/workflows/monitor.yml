name: fatsoma-monitor

# GitHub throttles frequent cron schedules to a few runs a day, so instead one
# long-lived job polls every 60s for ~5.5h and dispatches its own successor
# shortly before it ends. The successor waits as a pending run in the same
# concurrency group and starts the moment this one finishes. The hourly cron
# only restarts the chain if a handoff is ever lost.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification with current availability"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ inputs.test && 'test' || 'monitor' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Test runs don't commit state, so they can't clobber the live loop's
      - name: Test notification
        if: ${{ inputs.test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py --test

      - name: Poll loop
        if: ${{ !inputs.test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fatsoma-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          handed_off=0
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            # Picks up config/code pushes within a minute, no restart needed
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; true; }
            python monitor.py || echo "monitor run failed, continuing"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "update state"
              { git pull -q --rebase origin main && git push -q; } || echo "push failed, retrying next loop"
            fi
            if [ "$handed_off" -eq 0 ] && [ $(( end - $(date +%s) )) -lt 600 ]; then
              gh workflow run monitor.yml --ref main && handed_off=1
            fi
            elapsed=$(( $(date +%s) - started ))
            sleep $(( elapsed < 55 ? 60 - elapsed : 5 ))
          done
